{% extends "base.html" %}
{% block title %}材料价格查询 - 跨境采购助手{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h3><i class="bi bi-search"></i> 材料价格查询</h3>
        <p class="text-muted">搜索、筛选、对比各类原材料的最新市场价格</p>
    </div>
</div>

<!-- Filters -->
<div class="card mb-3">
    <div class="card-body">
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label class="form-label">关键词搜索</label>
                <input type="text" class="form-control" id="searchInput" placeholder="搜索材料名称、规格...">
            </div>
            <div class="col-md-3">
                <label class="form-label">材料分类</label>
                <select class="form-select" id="categoryFilter">
                    <option value="">全部分类</option>
                    {% for cat in categories %}
                    <option value="{{ cat.name }}">{{ cat.icon }} {{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">排序</label>
                <select class="form-select" id="sortBy">
                    <option value="name">名称</option>
                    <option value="price_asc">价格 ↑</option>
                    <option value="price_desc">价格 ↓</option>
                    <option value="date">最新更新</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" id="searchBtn">
                    <i class="bi bi-search"></i> 查询
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Results -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <strong>查询结果</strong>
        <small class="text-muted" id="resultCount"></small>
    </div>
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>分类</th>
                    <th>材料名称</th>
                    <th>规格</th>
                    <th>单位</th>
                    <th>最新价格</th>
                    <th>趋势</th>
                    <th>更新时间</th>
                    <th>来源</th>
                </tr>
            </thead>
            <tbody id="materialsTable">
                <tr><td colspan="8" class="text-center text-muted py-4">点击"查询"加载数据</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/materials.js') }}"></script>
{% endblock %}
