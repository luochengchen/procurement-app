{% extends "base.html" %}
{% block title %}材料价格查询 - 跨境采购助手{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <div>
        <h3 class="mb-1"><i class="bi bi-search me-2 text-primary"></i>材料价格查询</h3>
        <p class="text-muted mb-0">搜索、筛选、对比各类原材料的最新市场价格</p>
    </div>
</div>

<!-- 筛选 -->
<div class="filter-bar">
    <div class="row g-2 align-items-end">
        <div class="col-md-3">
            <label class="form-label">关键词搜索</label>
            <input type="text" class="form-control" id="searchInput" placeholder="搜索材料名称、规格...">
        </div>
        <div class="col-md-2">
            <label class="form-label">材料分类</label>
            <select class="form-select" id="categoryFilter">
                <option value="">全部分类</option>
                {% for cat in categories %}
                <option value="{{ cat.name }}">{{ cat.icon }} {{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label">地区</label>
            <select class="form-select" id="regionFilter">
                <option value="">全部地区</option>
                {% for r in regions %}
                <option value="{{ r }}">{{ r }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label">排序</label>
            <select class="form-select" id="sortBy">
                <option value="name">名称</option>
                <option value="price_asc">价格 ↑</option>
                <option value="price_desc">价格 ↓</option>
                <option value="date">最新更新</option>
            </select>
        </div>
        <div class="col-md-3">
            <button class="btn btn-primary w-100" id="searchBtn">
                <i class="bi bi-search me-1"></i>查询
            </button>
        </div>
    </div>
</div>

<!-- 结果 -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-list-check me-1"></i>查询结果</span>
        <small class="text-muted" id="resultCount"></small>
    </div>
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>分类</th>
                    <th>材料名称</th>
                    <th>规格</th>
                    <th>地区</th>
                    <th>单位</th>
                    <th>最新价格</th>
                    <th>趋势</th>
                    <th>更新时间</th>
                    <th class="text-end">操作</th>
                </tr>
            </thead>
            <tbody id="materialsTable">
                <tr><td colspan="9" class="text-center text-muted py-4">点击"查询"加载数据</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 价格历史 Modal -->
<div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="background: var(--surface); color: var(--ink)">
            <div class="modal-header border-bottom" style="border-color: var(--border) !important">
                <h6 class="modal-title" id="historyTitle">价格历史</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="chart-container" style="height: 300px">
                    <canvas id="historyChart"></canvas>
                </div>
                <div class="table-responsive mt-3">
                    <table class="table table-sm" id="historyTable">
                        <thead><tr><th>日期</th><th>价格</th><th>涨跌</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/materials.js') }}"></script>
{% endblock %}
