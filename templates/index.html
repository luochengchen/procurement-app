{% extends "base.html" %}
{% block title %}首页 - 跨境采购助手{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <div>
        <h3 class="mb-1"><i class="bi bi-speedometer2 me-2 text-primary"></i>采购看板</h3>
        <p class="text-muted mb-0">实时材料报价概览，快速掌握市场行情</p>
    </div>
    <span class="badge-soft d-none d-md-inline-block"><i class="bi bi-arrow-repeat me-1"></i>自动刷新</span>
</div>

<!-- 统计卡片 -->
<div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
        <div class="card stat-card">
            <div class="stat-label">材料分类</div>
            <div class="stat-value" id="statCategories">-</div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card stat-card" style="border-left-color: var(--series-2)">
            <div class="stat-label">材料总数</div>
            <div class="stat-value" id="statUpdated">-</div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card stat-card" style="border-left-color: var(--critical)">
            <div class="stat-label">涨价品种</div>
            <div class="stat-value trend-up" id="statUp">-</div>
        </div>
    </div>
    <div class="col-6 col-md-3">
        <div class="card stat-card" style="border-left-color: var(--good)">
            <div class="stat-label">降价品种</div>
            <div class="stat-value trend-down" id="statDown">-</div>
        </div>
    </div>
</div>

<!-- 快捷入口 -->
<div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
        <a href="/materials" class="card quick-link d-block p-3 text-center">
            <i class="bi bi-search fs-2"></i>
            <div class="mt-2 fw-semibold">材料价格查询</div>
            <small class="text-muted">搜索 · 筛选 · 对比</small>
        </a>
    </div>
    <div class="col-6 col-md-3">
        <a href="/calculator" class="card quick-link d-block p-3 text-center">
            <i class="bi bi-calculator fs-2" style="color: var(--series-3)"></i>
            <div class="mt-2 fw-semibold">成本核算</div>
            <small class="text-muted">分项核算 · 一键导出</small>
        </a>
    </div>
    <div class="col-6 col-md-3">
        <a href="/image-search" class="card quick-link d-block p-3 text-center">
            <i class="bi bi-camera fs-2" style="color: var(--series-4)"></i>
            <div class="mt-2 fw-semibold">识图搜索</div>
            <small class="text-muted">拍照找货源</small>
        </a>
    </div>
    <div class="col-6 col-md-3">
        <a href="/certification" class="card quick-link d-block p-3 text-center">
            <i class="bi bi-patch-check fs-2" style="color: var(--series-5)"></i>
            <div class="mt-2 fw-semibold">认证查询</div>
            <small class="text-muted">合规出海 · 全球覆盖</small>
        </a>
    </div>
</div>

<!-- 图表 + 精选材料 -->
<div class="row g-3">
    <div class="col-lg-5">
        <div class="card h-100">
            <div class="card-header"><i class="bi bi-bar-chart me-1"></i>各分类材料分布</div>
            <div class="card-body">
                <div class="chart-container-sm" id="statsChartContainer">
                    <canvas id="statsChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    <div class="col-lg-7">
        <div class="card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-star me-1"></i>精选材料报价</span>
                <a href="/materials" class="btn btn-sm btn-outline-primary">查看全部</a>
            </div>
            <div class="card-body" id="featuredMaterials">
                <div class="text-center text-muted py-4">
                    <div class="spinner-border spinner-border-sm"></div>
                    加载中...
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
