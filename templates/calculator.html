{% extends "base.html" %}
{% block title %}成本核算 - 跨境采购助手{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h3><i class="bi bi-calculator"></i> 成本核算</h3>
        <p class="text-muted">按原材料、人力、水电气、加工费等分项核算产品总成本</p>
    </div>
</div>

<!-- 预设模板 -->
<div class="row mb-3">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body d-flex align-items-center gap-2 flex-wrap">
                <i class="bi bi-stars text-primary"></i>
                <label class="form-label mb-0 me-1">预设行业模板</label>
                <select class="form-select form-select-sm" id="templateSelect" style="max-width: 260px">
                    <option value="">选择模板...</option>
                </select>
                <button class="btn btn-sm btn-primary" id="loadTemplateBtn">
                    <i class="bi bi-box-arrow-in-down"></i> 加载模板
                </button>
                <small class="text-muted">加载后按需修改单价/数量</small>
            </div>
        </div>
    </div>
</div>

<!-- 材料价格联动 datalist（由 JS 填充） -->
<datalist id="materialOptions"></datalist>

<div class="row g-3">
    <!-- Input form -->
    <div class="col-lg-7">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong><i class="bi bi-list-ul"></i> 成本明细</strong>
                <button class="btn btn-sm btn-outline-primary" id="addRowBtn">
                    <i class="bi bi-plus-lg"></i> 添加行
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="costTable">
                    <thead class="table-light">
                        <tr>
                            <th style="width:18%">费用类型</th>
                            <th style="width:28%">项目名称</th>
                            <th style="width:10%">单位</th>
                            <th style="width:15%">单价</th>
                            <th style="width:10%">数量</th>
                            <th style="width:15%">小计</th>
                            <th style="width:4%"></th>
                        </tr>
                    </thead>
                    <tbody id="costItems">
                        <!-- Dynamic rows -->
                    </tbody>
                    <tfoot>
                        <tr class="cost-summary-row">
                            <td colspan="5" class="text-end">合计</td>
                            <td id="grandTotal">¥0.00</td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="card-footer">
                <button class="btn btn-primary" id="calcBtn">
                    <i class="bi bi-calculator"></i> 计算
                </button>
                <button class="btn btn-outline-secondary" id="clearBtn">
                    <i class="bi bi-trash"></i> 清空
                </button>
                <button class="btn btn-outline-success float-end" id="exportBtn">
                    <i class="bi bi-download"></i> 导出
                </button>
            </div>
        </div>
    </div>

    <!-- Breakdown -->
    <div class="col-lg-5">
        <div class="card">
            <div class="card-header"><strong><i class="bi bi-pie-chart"></i> 费用构成</strong></div>
            <div class="card-body" id="breakdown">
                <div class="chart-container-sm mb-3" id="pieChartContainer" style="display:none">
                    <canvas id="costPieChart"></canvas>
                </div>
                <div id="breakdownTable">
                    <p class="text-muted">点击"计算"查看费用构成分析</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const ITEM_TYPES = {{ item_types | tojson }};
</script>
<script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
{% endblock %}
